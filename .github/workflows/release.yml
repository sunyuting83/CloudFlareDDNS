name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送 v1.0.0 等标签时触发

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_name: rust-ddns-socat-x86_64
          - target: i686-unknown-linux-musl
            asset_name: rust-ddns-socat-x86
          - target: aarch64-unknown-linux-musl
            asset_name: rust-ddns-socat-arm64
          - target: armv7-unknown-linux-musleabihf
            asset_name: rust-ddns-socat-armv7

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Build Binary
        # 使用 --release 构建，并通过环境变量减少不必要的编译日志
        run: cross build --release --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Prepare Binary and Compress
        run: |
          # 进入构建目录
          cd target/${{ matrix.target }}/release
          
          # 1. 尝试去除符号表以减小体积 (strip)
          # 注意：cross 环境下部分架构的 strip 可能需要特定工具链，这里先尝试通用 strip
          strip rust-ddns-socat || true
          
          # 2. 重命名为矩阵定义的名称
          mv rust-ddns-socat ${{ matrix.asset_name }}
          
          # 3. 打包成 tar.gz
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
          # 生成更新日志（可选）
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}