<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CloudFlare DDNS</title>
  <meta name="description" content="">
  <meta name="author" content="">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/normalize.css">
  <link rel="stylesheet" href="/static/skeleton.css">
  <style>
    .docs-header {
      text-transform: uppercase;
      font-size: 1.4rem;
      letter-spacing: .2rem;
      font-weight: 600;
    }
    .docs-section {
      border-top: 1px solid #eee;
      padding: 4rem 0;
      margin-bottom: 0;
    }
  </style>
</head>

<script type="module">
  import { createApp } from '/static/petite-vue.es.js?module'
  const Rooturi = window.location.origin + '/api/'
  function httpserver(url = '', data = {}, type = 'GET'){
    type = type.toUpperCase()
    // 此处规定get请求的参数使用时放在data中，如同post请求
    if (type === 'GET') {
      let dataStr = ''
      Object.keys(data).forEach(key => {
        dataStr += key + '=' + data[key] + '&'
      })

      if (dataStr !== '') {
        dataStr = dataStr.substr(0, dataStr.lastIndexOf('&'))
        url = url + '?' + dataStr
      }
    }

    let requestConfig = {
      // fetch默认不会带cookie，需要添加配置项credentials允许携带cookie
      method: type,
      headers: {
        'Content-type':'application/json;charset=UTF-8'
      }
    }

    if (type === 'POST') {
      Object.defineProperty(requestConfig, 'body', {
        value: JSON.stringify(data)
      })
    }
    const get_url = Rooturi + url
    return new Promise((resolve) => {
      fetch(get_url, requestConfig)
        .then(res => {
          if(res.ok) {
            resolve (res.json())
          }else {
            resolve({
              status: 500,
              message: res.status
            })
          }
        })
        .catch((err) => {
          resolve({
            status: 500,
            message: err.message
          })
        })
    })
  }
  function Counter() {
    return {
      data: {
        "ApiStatus":"",
        "Domains":"",
        "HasError":false,
        "IPv4":"",
        "IPv6":"",
        "InterFace":"",
        "InterFacesList":[],
        "Proxy":false,
        "ScanTime":0,
        "TaskStatus":"",
        "Token":"",
        "Type":0,
        "ZoneID":"",
        "message":"",
        "status":200
      },
      selected: "",
      ipselected: "",
      loading:false,
      passowrd: '',
      async mounted() {
        console.log(`I'm mounted!`)
        this.data = await httpserver("status")
        if (this.data.status === 200) {
          this.ipselected = String(this.data.Type)
          this.data.InterFacesList.forEach(el => {
            if (el === this.data.InterFace) {
              this.selected = el;
            }
          });
          this.loading = true
        }
      }
    }
  }
  createApp({
    Counter
  })
  .mount()
</script>

<body>
  <div class="container" v-scope="Counter()" @vue:mounted="mounted">
    <div class="section docs-section" v-if="loading">
      <h6 class="docs-header">接口设置</h6>
      <div class="row">
        <div class="four columns">
          <label for="exampleEmailInput">更新状态</label>
          {{data.ApiStatus}}
        </div>
        <div class="four columns">
          <label for="exampleEmailInput">任务状态</label>
          {{data.TaskStatus === 'running' ? "运行中" : "已停止"}}
        </div>
        <div class="four columns">
          <label for="exampleEmailInput">是否出错</label>
          {{data.HasError ? "发生错误": "一切正常"}}
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleEmailInput">ZoneID</label>
          <input class="u-full-width" type="text" placeholder="{data.ZoneID.length > 0 ? data.ZoneID : 'ZoneID'}" :value=data.ZoneID />
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleEmailInput">Token</label>
          <input class="u-full-width" type="text" placeholder="Token" :value=data.Token />
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleEmailInput">域名</label>
          <input class="u-full-width" type="text" placeholder="Domains" :value=data.Domains />
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleRecipientInput">IP类型</label>
          <select class="u-full-width" v-model="ipselected">
            <option value="0">IPv4</option>
            <option value="1">IPv6</option>
            <option value="2">IPv4&IPv6</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleRecipientInput">网卡</label>
          <select class="u-full-width" v-model="selected">
            <option v-for="interface in data.InterFacesList" :value=interface>{{interface}}</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleEmailInput">更新频率</label>
          <input class="u-full-width" type="number" :value=data.ScanTime />
        </div>
      </div>
      <div class="row">
        <div class="columns">
          <label for="exampleEmailInput">云代理</label>
          <label class="example-send-yourself-copy">
            <input type="checkbox" :value=data.Proxy>
            <span class="label-body">云代理</span>
          </label>
        </div>
      </div>
      <input class="button-primary" type="submit" value="提交">
    </div>

    <div class="section docs-section">
      <h6 class="docs-header">密码修改</h6>
      <div class="row">
        <div class="columns">
          <label for="exampleEmailInput">新密码</label>
          <input class="u-full-width" type="text" placeholder="新密码" v-modle="passowrd">
        </div>
      </div>
      <input class="button-primary" type="submit" value="提交">
    </div>
  </div>
</body>
</html>
