<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CloudFlare DDNS - Rust Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/normalize.css">
  <link rel="stylesheet" href="/static/skeleton.css">
  <style>
    .docs-header { text-transform: uppercase; font-size: 1.4rem; letter-spacing: .2rem; font-weight: 600; }
    .docs-section { border-top: 1px solid #eee; padding: 4rem 0; margin-bottom: 0; }
    .docs-span { height: 38px; padding: 6px 10px 6px 0px; margin-bottom: 1.5rem; line-height: 38px; display: inline-block; }
    .red { color: brown; font-weight: bold; }
    .container { padding-bottom: 60px; }
    .dark { background: #1a1a1a; color: #eee; }
    .dark .u-full-width { color: #000; }
    .dark input, .dark select { background: #fff; }
    .dark button[disabled] { background: #444; color: #888; border-color: #444; }
    .close { margin-left: 2rem; cursor: pointer; color: #f05433; }
    .button.button-primary, button.button.red-button { background-color: #f05433; border-color: #f05433; margin-left: 10px; color: #fff; }
    .mode-card { background: rgba(240, 84, 51, 0.1); padding: 15px; border-radius: 8px; border: 1px dashed #f05433; margin-bottom: 2rem; }
    @media screen and (max-width: 768px) {
      .auto-width { width: 100%; overflow-x: scroll; }
      .auto-width table { width: 960px; }
    }
  </style>
</head>

<script type="module">
  import { createApp } from '/static/petite-vue.es.js'
  const Rooturi = window.location.origin + '/api/'

  function httpserver(url = '', data = {}, type = 'GET'){
    type = type.toUpperCase()
    let requestConfig = {
      method: type,
      headers: { 'Content-type':'application/json;charset=UTF-8' }
    }
    if (type === 'GET') {
      let dataStr = Object.keys(data).map(key => `${key}=${data[key]}`).join('&')
      if (dataStr) url += '?' + dataStr
    } else {
      requestConfig.body = JSON.stringify(data)
    }
    return fetch(Rooturi + url, requestConfig)
      .then(res => res.ok ? res.json() : { status: 500, message: res.statusText })
      .catch(err => ({ status: 500, message: err.message }))
  }

  function Counter() {
    return {
      add_socat: { "Name": "", "Pid": 0, "ConnType": "TCP6", "Port": 0, "ForkIp": "", "ForkPort": 0, "ForkType": "TCP" },
      socat_data: { "SocatList": [], "SocatStatus": 1, "SocatVersion": "" },
      data: {
        "ApiStatus":false, "Domains":"", "HasError":false, "IPv4":"", "IPv6":"", "InterFace":"",
        "InterFacesList":[], "Proxy":false, "ScanTime":30, "TaskStatus":false, "Token":"",
        "Type":"0", "ZoneID":"", "status":200, "Version": "1.0.1",
        "UseApi": false, "IpSourcesV4": [], "IpSourcesV6": []
      },
      loading:false, sloading: false, passowrd: "", set_message: "", pow_message: "", dark: false, socat_message: "",
      
      mounted() {
        const hours = new Date().getHours()
        if (hours >= 20 || hours < 6) this.light()
        this.GetStatusData()
        this.GetSocatData()
      },

      async GetStatusData(){
        const res = await httpserver("status")
        if (res.status === 200) {
          this.data = res
          this.data.Type = String(res.Type) // 确保 select 能够匹配
          this.loading = true
        }
      },

      async putData(){
        const post_data = {
          "ZoneID": this.data.ZoneID,
          "Token": this.data.Token,
          "RecordType": parseInt(this.data.Type),
          "Proxy": this.data.Proxy,
          "Interfaces": this.data.InterFace,
          "Domains": this.data.Domains,
          "ScanTime": parseInt(this.data.ScanTime),
          "UseApi": this.data.UseApi
        }
        const res = await httpserver("setconfig", post_data, "PUT")
        if (res.status === 200) this.GetStatusData()
        this.showAndHideMessage("set", res.message)
      },

      // ... 其他 Socat 相关函数保持不变 ...
      async GetSocatData(){
        const res = await httpserver("socat_status")
        if (res.status === 200) {
          this.socat_data.SocatList = res.SocatList
          this.socat_data.SocatStatus = res.SocatStatus
          this.socat_data.SocatVersion = res.SocatVersion
          this.sloading = true
        }
      },
      async AddSocat(){
        this.add_socat.Port = parseInt(this.add_socat.Port)
        this.add_socat.ForkPort = parseInt(this.add_socat.ForkPort)
        const res = await httpserver("add_socat", this.add_socat, "POST")
        if (res.status === 200) this.GetSocatData()
        this.showAndHideMessage("socat", res.message)
      },
      async DeleteSocat(id, name){
        const res = await httpserver("del_socat", {"Pid": id, "Name": name}, "DELETE")
        if (res.status === 200) this.GetSocatData()
        this.showAndHideMessage("socat", res.message)
      },
      async ChangeSocat(pid){
        const item = this.socat_data.SocatList.find(el => el.Pid === pid)
        if (item) {
          item.Port = parseInt(item.Port); item.ForkPort = parseInt(item.ForkPort)
          const res = await httpserver("change_socat", item, "PUT")
          if (res.status === 200) this.GetSocatData()
          this.showAndHideMessage("socat", res.message)
        }
      },
      async changePassword(){
        const res = await httpserver("setpassword", { "Password": this.passowrd }, "PUT")
        this.pow_message = res.message
      },
      showAndHideMessage(type, msg){
        if (type === "socat") { this.socat_message = msg; setTimeout(() => this.socat_message = "", 5000) }
        else { this.set_message = msg; setTimeout(() => this.set_message = "", 5000) }
      },
      light(){ this.dark = !this.dark; document.body.className = this.dark ? "dark" : ""; },
      isIPv4(str) { return /^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/.test(str); }
    }
  }
  createApp({ Counter }).mount()
</script>

<body>
  <div class="container" v-scope="Counter()" @vue:mounted="mounted">
    <!-- DDNS 设置部分 -->
    <div class="section docs-section" v-if="loading">
      <h6 class="docs-header">
        <span>Cloudflare DDNS {{data.Version}}</span>
        <span class="close" @click="light">{{dark ? "开灯" : "关灯"}}</span>
      </h6>
      <p class="red" v-if="set_message">{{set_message}}</p>

      <div class="row">
        <div class="four columns">
          <label>控制</label>
          <button class="button-primary" @click="GetStatusData">刷新状态</button>
        </div>
        <div class="four columns">
          <label>任务状态</label>
          <span class="docs-span"><strong>{{data.TaskStatus ? "运行中" : "停止"}}</strong></span>
        </div>
        <div class="four columns">
          <label>熔断指示</label>
          <span class="docs-span" :style="{color: data.HasError ? 'red' : 'green'}">{{data.HasError ? "异常挂起" : "健康"}}</span>
        </div>
      </div>

      <div class="row">
        <div class="six columns"><label>当前 IPv4</label><span class="docs-span">{{data.IPv4 || '未获取'}}</span></div>
        <div class="six columns"><label>当前 IPv6</label><span class="docs-span">{{data.IPv6 || '未获取'}}</span></div>
      </div>

      <div class="row">
        <div class="six columns"><label>ZoneID</label><input class="u-full-width" type="text" v-model="data.ZoneID"></div>
        <div class="six columns"><label>Token</label><input class="u-full-width" type="password" v-model="data.Token"></div>
      </div>

      <div class="row">
        <div class="eight columns"><label>域名 (多个用逗号隔开)</label><input class="u-full-width" type="text" v-model="data.Domains"></div>
        <div class="four columns">
          <label>记录类型</label>
          <select class="u-full-width" v-model="data.Type">
            <option value="0">A (IPv4)</option>
            <option value="1">AAAA (IPv6)</option>
            <option value="2">双栈 (A & AAAA)</option>
          </select>
        </div>
      </div>

      <!-- IP 获取模式切换逻辑 -->
      <div class="mode-card">
        <div class="row">
          <label>
            <input type="checkbox" v-model="data.UseApi">
            <span class="label-body"><strong>使用远程 API 获取公网 IP</strong> (推荐：无需公网 IP 在网卡上)</span>
          </label>
        </div>

        <div class="row" v-if="!data.UseApi">
          <label>本地网卡选择</label>
          <select class="u-full-width" v-model="data.InterFace">
            <option v-for="i in data.InterFacesList" :value="i">{{i}}</option>
          </select>
        </div>

        <div class="row" v-else>
          <div class="six columns">
            <label><small>IPv4 备选源</small></label>
            <select class="u-full-width" disabled><option v-for="s in data.IpSourcesV4">{{s}}</option></select>
          </div>
          <div class="six columns">
            <label><small>IPv6 备选源</small></label>
            <select class="u-full-width" disabled><option v-for="s in data.IpSourcesV6">{{s}}</option></select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="six columns"><label>更新频率 (秒)</label><input class="u-full-width" type="number" v-model="data.ScanTime"></div>
        <div class="six columns"><label>Cloudflare 代理 (小黄云)</label><label><input type="checkbox" v-model="data.Proxy"><span class="label-body">启用代理</span></label></div>
      </div>

      <button class="button-primary" @click="putData" 
        :disabled="data.ZoneID.length < 30 || data.Token.length < 30 || (!data.UseApi && !data.InterFace) || !data.Domains.includes('.')">
        保存并应用配置
      </button>
    </div>

    <!-- Socat 部分保持结构 -->
    <div class="section docs-section" v-if="sloading">
      <h6 class="docs-header">Socat 端口转发 (V{{socat_data.SocatVersion}})</h6>
      <p class="red" v-if="socat_message">{{socat_message}}</p>
      <div class="auto-width">
        <table class="u-full-width">
          <thead>
            <tr><th>名称</th><th>协议</th><th>外部端口</th><th>内部 IPv4</th><th>内部端口</th><th>操作</th></tr>
          </thead>
          <tbody>
            <tr v-for="socat in socat_data.SocatList" :key="socat.Pid">
              <td><input class="u-full-width" type="text" v-model="socat.Name"></td>
              <td><select class="u-full-width" v-model="socat.ConnType"><option value="TCP6">TCP6</option><option value="UDP6">UDP6</option></select></td>
              <td><input class="u-full-width" type="number" v-model="socat.Port"></td>
              <td><input class="u-full-width" type="text" v-model="socat.ForkIp"></td>
              <td><input class="u-full-width" type="number" v-model="socat.ForkPort"></td>
              <td>
                <button class="button-primary" @click="ChangeSocat(socat.Pid)">修改</button>
                <button class="button red-button" @click="DeleteSocat(socat.Pid, socat.Name)">删除</button>
              </td>
            </tr>
            <tr>
              <td><input class="u-full-width" type="text" v-model="add_socat.Name" placeholder="新任务名"></td>
              <td><select class="u-full-width" v-model="add_socat.ConnType"><option value="TCP6">TCP6</option><option value="UDP6">UDP6</option></select></td>
              <td><input class="u-full-width" type="number" v-model="add_socat.Port"></td>
              <td><input class="u-full-width" type="text" v-model="add_socat.ForkIp"></td>
              <td><input class="u-full-width" type="number" v-model="add_socat.ForkPort"></td>
              <td><button class="button-primary" @click="AddSocat">新增转发</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 密码修改 -->
    <div class="section docs-section">
      <h6 class="docs-header">管理密码修改</h6>
      <p class="red" v-if="pow_message">{{pow_message}}</p>
      <div class="row">
        <div class="six columns"><label>新密码</label><input class="u-full-width" type="password" v-model="passowrd" placeholder="至少 8 位"></div>
        <div class="six columns" style="padding-top: 30px;"><button class="button-primary" @click="changePassword" :disabled="passowrd.length < 8">更新密码</button></div>
      </div>
    </div>
  </div>
</body>
</html>
